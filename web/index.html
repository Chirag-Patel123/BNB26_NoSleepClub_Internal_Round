    <script>
      // Suppress noisy third-party browser extension errors (e.g. SingleFile 'save-page', extension media play interruptions)
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = String(event.reason.message || event.reason);
          if (msg.includes('save-page') || msg.includes('play() request was interrupted') || msg.includes('menu item with id')) {
            event.preventDefault();
            return;
          }
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event && event.message || '');
        if (msg.includes('save-page') || msg.includes('menu item with id')) {
          event.preventDefault();
        }
      });
    </script>
